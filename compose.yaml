
name: customer-churn-prediction

services:
  churn-app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:8002:8000"

    volumes:
      - churn_database:/app/data

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"

      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  churn_database:
